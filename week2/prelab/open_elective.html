<!DOCTYPE html>
<html>
<head>
    <title>Open Elective Courses</title>
</head>
<body>

    <h1>Open Elective Course Selection</h1>

    <form>

        <label>Student Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Roll Number:</label>
        <input type="text" name="rollno">
        <br><br>

        <label>Select Open Elective:</label>
        <br>

        <input type="radio" name="elective" value="AI">
        Artificial Intelligence
        <br>

        <input type="radio" name="elective" value="ML">
        Machine Learning
        <br>

        <input type="radio" name="elective" value="Cloud">
        Cloud Computing
        <br>

        <input type="radio" name="elective" value="Cyber Security">
        Cyber Security
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
