<!DOCTYPE html>
<html>
<head>
    <title>Password Validation</title>
</head>
<body>

    <h1>Password Validation</h1>

    <script>
        let password = prompt("Enter your password:");

        let pattern = /^[A-Z](?=.*\d).{7,}$/;

        if (pattern.test(password)) {
            document.write("Valid Password");
        } else {
            document.write("Invalid Password");
        }
    </script>

</body>
</html>
