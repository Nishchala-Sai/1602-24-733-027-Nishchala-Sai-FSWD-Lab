<!DOCTYPE html>
<html>
<head>
    <title>Student Names</title>
</head>
<body>

    <h1>Student Names</h1>

    <script>
        let students = ["Nishchala", "Rahul", "Priya", "Ananya"];

        let display = (name) => `Student: ${name}`;

        students.forEach(name => {
            document.write(display(name) + "<br>");
        });
    </script>

</body>
</html>
