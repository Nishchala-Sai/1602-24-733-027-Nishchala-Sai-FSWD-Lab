<!DOCTYPE html>
<html>
<head>
    <title>Cookie Detection</title>
</head>
<body>

    <h1>Cookie Status</h1>

    <script>
        if (navigator.cookieEnabled) {
            document.write("Cookies are enabled.");
        } else {
            document.write("Cookies are disabled.");
        }
    </script>

</body>
</html>
